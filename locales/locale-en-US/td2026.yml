  #######################################################
  #                                                     #
  #                      INTROS                         #
  #                                                     #
  #######################################################

  - key: general.td2026.survey_intro
    t: |
      2026 has brought many changes for international developers in Japan. AI is changing the nature of software development, the government is tightening immigration policy, and the yen's value has decreased significantly.


      We’ve been running the TokyoDev Developer Survey for close to a decade now, and this year's edition feels more important than ever.

      The survey is anonymous, and we’ll only share aggregated results, never individual responses.

      Last year, [over 900 developers took part](https://2025.surveys.tokyodev.com/en-US/demographics/).  The more answers we have, the clearer a picture we can build for international developers in Japan, so please share the survey with your friends, colleagues, and workplaces!

  # user_info

  - key: user_info.user_info_intro_td2026
    t: |
      Welcome to the 2026 TokyoDev survey! It should take about 10 minutes to complete.

      Note: If a question is not applicable to your current situation, just click the **skip** button.

  - key: user_info.japan_province.takeaway.td2026
    t: |
      79% of respondents lived in the Greater Tokyo Area (Tokyo, Saitama, Chiba, and Kanagawa).
  - key: user_info.residency_status.takeaway.td2026
    t: |
      58% of respondents had a residency status tied to their employment (engineer or highly skilled foreign professional).

      Highly skilled foreign professional status was most common among new arrivals: 22% of those who had been in Japan less than a year held it, compared to 11% of those here 1–3 years and 5% of those here longer. This likely reflects its fast track to permanent residency, which holders can apply for after one to three years.
  - key: user_info.country.takeaway.td2026
    t: |
      Survey respondents hailed from 80 different countries or regions.
  - key: user_info.age.takeaway.td2026
    t: |
      79% of respondents were between 20 and 39 years old.

      Older respondents were much more likely to work fully remotely: 28% of those in their 40s did so, compared to 15% of those in their 30s and 10% of those in their 20s. Respondents in their 20s were also the most likely to have no remote work at all, at 20%.
  - key: user_info.gender.takeaway.td2026
    t: |
      Male respondents had more experience than female respondents. Men averaged 9 years of professional experience, compared to 6.8 years for women.

      Men also earned more, with an average compensation of ¥11 million, 42% higher than the ¥7.7 million women earned. Experience explains only part of this gap. Had men had the same mix of experience as women, they would have averaged ¥9.7 million, still 26% more than women.

      The reasons behind this disparity are complex, but it's clear that women face challenges in the Japanese tech industry. For ideas on concrete action your company can take to help, please see [this article](https://www.tokyodev.com/articles/hiring-women-on-your-engineering-team).
  - key: user_info.identify_as_lgbtq.takeaway.td2026
    t: |
      7% of respondents identified as LGBTQ+.

      There was a large gap by gender: 4% of men identified as LGBTQ+, compared to 28% of women.

      One barrier LGBTQ+ software developers face when considering a move to Japan is that same-sex marriage is not legally recognized. TokyoDev [supports the legalization of same-sex marriage](https://www.tokyodev.com/articles/tokyodev-supports-the-legalization-of-same-sex-marriage-in-japan), and is a member of [Business for Marriage Equality](https://bformarriageequality.net).
  - key: user_info.religion.takeaway.td2026
    t: |
      Religious beliefs varied considerably by nationality. For instance, 59% of Indonesian respondents were religious and practicing, whereas 94% of French respondents were atheist or agnostic.

      For one developer's experience of practicing their faith while working in tech here, see [Being a Muslim Software Engineer in Japan](https://www.tokyodev.com/articles/being-a-muslim-software-engineer-in-japan).
  - key: user_info.years_of_experience.takeaway.td2026
    t: |
      The median respondent had 8 years of professional software development experience.

      Compensation generally grew with experience. Respondents with less than 1 year of experience made a median of ¥4.5 million, while those with more than 20 years of experience made a median of ¥16.5 million.
  - key: user_info.years_in_japan.takeaway.td2026
    t: |
      The median respondent had lived in Japan for 5 years. Japanese ability grew steadily with time in Japan: 18% of those who had been here 3 years or less had business-level Japanese or better, compared to 65% of those who had been here 10 years or more.

      Long-term residents were also less likely to live in Tokyo: 46% of those who had been here 10 years or more lived in Tokyo, compared to 63% of those who had been here less than 10 years.
  - key: user_info.professional_qualifications.takeaway.td2026
    t: |
      74% of respondents had a bachelor's degree or higher related to computer science. Respondents with a doctorate stood out, with a median compensation of ¥14.5 million, compared to ¥9.5 million overall. That wasn't because they had more experience: they averaged 8.8 years, the same as respondents overall. Only 25 respondents had a doctorate, however.
  - key: user_info.language_proficiency_english.takeaway.td2026
    t: |
      98% of respondents were comfortable using English in a professional setting.

      Respondents less fluent in English were the most enthusiastic about AI: 31% of those with business-level English or below said AI had made their day-to-day work much better, compared to 20% of fluent speakers and 14% of native speakers.
  - key: user_info.language_proficiency_japanese.takeaway.td2026
    t: |
      38% of respondents were comfortable using Japanese in a professional setting. Japanese ability strongly shaped respondents' experience of living here: 68% of those with basic or no Japanese cited cultural barriers as a negative aspect of life in Japan, compared to 36% of those with business-level Japanese or better.
  - key: user_info.jlpt_level.takeaway.td2026
    t: |
      69% of respondents with business-level Japanese had passed JLPT N2 or higher. Among those who were fluent, this rose to 87%.

      The most advanced learners were also the biggest fans of Japanese pop culture: 60% of N1 holders named it as a positive aspect of life in Japan, compared to 50% of N2 holders and 36% of those with N3 or lower or no JLPT.
  - key: user_info.other_japanese_certifications.takeaway.td2026
    t: |
      Japanese language certifications other than the JLPT were rare: 91% of respondents had none. The most common, the JPT, was held by just 3%.

  # job_info

  - key: job_info.employment_status.takeaway.td2026
    t: |
      Compensation largely tracked experience. Company directors averaged the most experience, 13.7 years, and the highest compensation, ¥15.3 million, though only 14 respondents were directors. Contract employees and temporary workers averaged around seven years of experience and ¥7.5 to ¥8.3 million. Freelancers were the exception: they averaged 10.7 years of experience, about two years more than permanent employees, but made about the same, ¥11.2 million compared to ¥11.1 million.
  - key: job_info.current_employer.takeaway.td2026
    t: |
      Those working for a Japanese subsidiary of an international company made 35% more than those working for a Japanese-headquartered company, [the same gap as in 2025](https://2025.surveys.tokyodev.com/en-US/current-job/current_employer). This ends several years of the gap shrinking, from a peak of [93% more in 2022](https://www.tokyodev.com/insights/2022-developer-survey#employer-type) to [73% more in 2023](https://2023.surveys.tokyodev.com/en-US/employer-info/current_employer) to [47% more in 2024](https://2024.surveys.tokyodev.com/en-US/current-job/current_employer). That decline was driven by respondents at subsidiaries reporting lower median compensation, while the compensation for respondents at Japanese-headquartered companies remained stable.
  - key: job_info.languages_used_colleagues_english.takeaway.td2026
    t: |
      Respondents who always used English had the highest compensation, with a median of ¥10.5 million. They were also the least likely to work for a Japanese-headquartered company: 66% did, compared to 94% of those who never used English.
  - key: job_info.languages_used_colleagues_japanese.takeaway.td2026
    t: |
      Respondents who never used Japanese with colleagues stood out in how they worked. 30% of them worked fully remotely, twice the rate of any other group.

      They also worked the least overtime: 45% of those who never used Japanese did no overtime at all, compared to 18% of those who always used it. Overtime rose steadily with Japanese usage: 44% of respondents who always used Japanese worked 10 or more hours of overtime a month, compared to 23% of those who never used it.
  - key: job_info.searching_for_job.takeaway.td2026
    t: |
      44% of respondents who could not work remotely were looking for a job, compared to between 14% and 27% of those whose workplaces allowed remote work. Experience did not explain the difference: job seekers had the same median experience as other respondents, 8 years.
  - key: job_info.discrimination_issues.takeaway.td2026
    t: |
      Respondents who had experienced workplace discrimination were less happy with their jobs. Those who had been discriminated against because of their country of origin, the most common form of discrimination, had an average job happiness of 2.8 out of 5, compared to 3.5 overall. Those discriminated against because of a mental condition were the least happy, at 2.4.

      They were also much more likely to be looking for a new job: 44% of respondents who had experienced discrimination were actively searching, compared to 18% of those who hadn't.
  - key: job_info.job_happiness.takeaway.td2026
    t: |
      Only 17% of respondents felt negatively about their current job.

      Almost none of the respondents who were very happy with their job were looking for a new one. This percentage increased the less happy respondents were, with 74% of those who were very unhappy actively searching for a new role.
  - key: job_info.industry_sector.takeaway.td2026
    t: |
      E-commerce stood out for its approach to AI: 41% of respondents in e-commerce said their employer required them to use AI, double the 20% overall. This wasn't just because many of them worked at large companies. At companies with more than 10,000 employees, 47% of e-commerce respondents were required to use AI, compared to 15% of those in other industries.
  - key: job_info.working_hours_policy.takeaway.td2026
    t: |
      Flexible working hours went hand in hand with remote work. 55% of respondents who could not work remotely had fixed working hours, compared to 13% of those with hybrid arrangements and 7% of those who could choose whether to work remotely. Among fully remote respondents, 50% had fully flexible hours.
  - key: job_info.overtime_hours.takeaway.td2026
    t: |
      70% of respondents worked fewer than 10 hours of overtime in a typical month, and only 7% worked 30 or more. Working more overtime wasn't associated with higher compensation.
  - key: job_info.overtime_pay.takeaway.td2026
    t: |
      60% of respondents had fixed overtime pay (minashi zangyō) included in their compensation. This had little connection to how much overtime they actually worked: those with and without fixed overtime pay both worked a median of 1–9 hours of overtime a month, and half of the respondents who worked no overtime at all still received it.
  - key: job_info.remote_work_policy.takeaway.td2026
    t: |
      Companies are continuing to move away from letting employees choose whether to work remotely. Last year, 32% of respondents could decide for themselves; this year, that fell to 27%. Most of the shift appears to be toward hybrid work, which rose from 43% to 46%, continuing its upward trend.

      Respondents at organizations that permit remote work were happier with their job. On a scale of 1–5, those who could choose whether to work remotely had an average happiness score of 3.7, and those who worked fully remotely scored 3.6, compared to 2.9 for respondents who could never work remotely. Those in hybrid work environments scored an average of 3.4.
  - key: job_info.company_size.takeaway.td2026
    t: |
      While only 16% of respondents worked at a company with more than 10,000 employees, 38% of respondents making ¥20 million or more worked at such a company.
  - key: job_info.current_total_annual_compensation.takeaway.td2026
    t: |
      The median total compensation of respondents was ¥9.5 million, unchanged from [last year](https://2025.surveys.tokyodev.com/en-US/current-job/current_total_annual_compensation). 10% of respondents made ¥20 million or more.
  - key: job_info.income_evolution.takeaway.td2026
    t: |
      Only 7% of respondents reported that their income had decreased over the last year. Permanent employees were the most likely to see their income rise: 68% did, compared to 43% of freelancers and 37% of contract employees.

  # technology

  - key: technology.work_areas.takeaway.td2026
    t: |
      Back-end development was the most common area respondents worked in, at 71%, followed by front-end development at 50%. Areas with more experienced respondents generally paid more, with people management (¥13.8 million on average) and platform engineering (¥13.4 million) at the top. Machine learning was the exception: respondents working in it averaged the least experience of any area, 7.5 years compared to 8.8 overall, yet made ¥11.8 million, above the ¥10.7 million average. Game development went the other way, averaging 10.7 years of experience but only ¥9.9 million.
  - key: technology.programming_languages.takeaway.td2026
    t: |
      Python remained the most popular language, used by 49% of respondents. TypeScript overtook JavaScript for second place, at 46% compared to 40%, and Go saw the largest gain, rising from 14% to 21%.

      Rust and Elixir users had the highest median compensation, at ¥12.5 million, while PHP users had the lowest, at ¥6.5 million.
  - key: technology.web_frameworks.takeaway.td2026
    t: |
      React remained the most popular web framework, used by 39% of respondents. FastAPI saw the largest gain, rising from 12% to 17%, while Ruby on Rails fell from 13% to 9%.
  - key: technology.other_frameworks_libraries.takeaway.td2026
    t: |
      NumPy and pandas were the most widely used libraries, at 21% and 20% respectively, though 42% of respondents used none of the listed options. Apache Kafka users had the highest median compensation, at ¥11.5 million.
  - key: technology.cloud_platforms.takeaway.td2026
    t: |
      AWS remained the most popular cloud platform, used by 62% of respondents, down from 66% last year. Google Cloud rose from 31% to 36%.
  - key: technology.software_engineering_practices.takeaway.td2026
    t: |
      Greater use of English correlated with a higher adoption rate of software engineering best practices, even among those working at Japanese-headquartered companies.

      At those companies, 70% of respondents who used English frequently or always said their employer used continuous integration, compared to 42% of those who rarely or never did. Similarly, 67% of frequent English users worked at organizations with monitoring and logging, compared to 39% of infrequent users. For automated testing, the figures were 68% versus 42%, and for infrastructure as code, 54% versus 32%. The only practice more common among infrequent English users was waterfall development, used by 28% compared to 11% of frequent users.

  # ai_usage

  - key: ai_usage.ai_tools.takeaway.td2026
    t: |
      96% of respondents used AI tools. Claude overtook ChatGPT as the most popular, used by 72% of respondents, while ChatGPT fell from 71% last year to 46%. Claude Code, newly listed this year, was used by 68%.
  - key: ai_usage.ai_generated_code_balance.takeaway.td2026
    t: |
      78% of respondents were generating at least half the code they produced through AI, up from about a third last year. Claude Code users were the heaviest adopters: 72% of them generated at least three-quarters of their code with AI, compared to 36% of other respondents.
  - key: ai_usage.more_productive.takeaway.td2026
    t: |
      Only about one in ten respondents disagreed that AI tools made them a lot more productive, down from one in six last year.

  - key: ai_usage.job_security_threat.takeaway.td2026
    t: |
      32% of respondents saw AI as a threat to their job security, up from 19% last year.
  - key: ai_usage.ai_code_generation_frequency.takeaway.td2026
    t: |
      68% of respondents used AI tools to generate or refactor code at least a few times a day, up from 38% last year. 33% said they used them constantly, compared to 9% last year.
  - key: ai_usage.ai_management_pressure.takeaway.td2026
    t: |
      85% of respondents said their employer encouraged or required AI use, with 20% saying it was required. Mandates made a difference: where AI use was required, 86% of respondents generated at least three-quarters of their code with AI, compared to 59% where it was merely encouraged.
  - key: ai_usage.ai_impact.takeaway.td2026
    t: |
      Most respondents felt AI had improved their work: 54% said it had made their day-to-day experience as a developer better, while about a quarter said it had made it worse.

      How respondents felt closely tracked whether AI made them more productive. Among those who strongly agreed that AI tools made them a lot more productive, 86% said their day-to-day experience had improved. Among those who disagreed, 73% said it had gotten worse.

  # life_in_japan

  - key: life_in_japan.life_japan_positive_aspects.takeaway.td2026
    t: |
      Safety, convenience, and infrastructure were the most commonly cited positive aspects of life in Japan, each chosen by over 80% of respondents. Americans stood out: 85% cited healthcare and 80% the cost of living, compared to 59% and 49% of other respondents. They were also less likely to cite career opportunities, at 9% compared to 26%.

      Last year, respondents could choose at most three positive aspects; this year there was no limit. That's why every option shows such a large increase compared to last year.
  - key: life_in_japan.life_japan_negative_aspects.takeaway.td2026
    t: |
      Poor compensation was the most commonly cited negative aspect of life in Japan, chosen by 69% of respondents. Isolation, cultural barriers, and hostility towards foreigners followed, each cited by around half of respondents.

      How respondents felt about their jobs shaped their view of Japan's working life, but not the rest of it. Among those unhappy with their jobs, 60% cited work culture and 60% limited career growth, compared to 15% and 23% of those who were very happy. Isolation, by contrast, was cited by both groups at about the same rate.

      Last year, respondents could choose at most three negative aspects; this year there was no limit. That's why every option shows such a large increase compared to last year.
  - key: life_in_japan.quality_of_life_over_time.takeaway.td2026
    t: |
      57% of respondents said their quality of life had improved since first arriving in Japan, including 32% who said it had gotten a lot better. 17% said it had gotten worse.
  - key: life_in_japan.remaining_in_japan.takeaway.td2026
    t: |
      44% of respondents planned to stay in Japan permanently, while 29% weren't sure. Those with stronger Japanese were more likely to settle: 52% of respondents with business-level Japanese or better planned to stay permanently, compared to 35% of those with basic or no Japanese.
  - key: life_in_japan.new_immigration_measures.takeaway.td2026
    t: |
      538 respondents reported that changes to Japan's immigration and residency policies over the past year had affected their life. The most common effect was feeling less welcome, cited by 67% of them, followed by uncertainty about staying in Japan (60%) and increased anxiety (56%).

      Permanent residents were largely spared the practical effects, but not the change in mood. Only 11% of affected permanent residents had concerns about their residency status, compared to 50% of those on an engineer visa. Yet 81% of them felt less welcome, more than any other group.
  - key: life_in_japan.yen_value.takeaway.td2026
    t: |
      64% of respondents said the weakening yen had hurt their personal finances, including 18% who said the impact was significant. Only 8% said it had helped.
  - key: life_in_japan.communities.takeaway.td2026
    t: |
      44% of respondents weren't active in any developer communities, down from 51% last year. TokyoDev's Discord remained the most popular community, at 26%, while participation in TokyoDev's in-person meetups rose from 8% to 13%.

      Women and coding bootcamp graduates were the most connected. 66% of women were active in at least one developer community, compared to 55% of men, and 32% of women were part of Women in Software Engineering Japan. Among bootcamp graduates, 83% were active, compared to 52% of other respondents.

  #######################################################
  #                                                     #
  #            RESULTS INTRO OVERVIEW                   #
  #                                                     #
  #######################################################

  - key: overview_1_median_compensation.td2026
    t: |
      # Insights from the 2026 TokyoDev Developer Survey

      Each year, TokyoDev runs a survey to better understand the experiences of international software developers in Japan. This year 733 people participated, answering nearly 50 questions on topics such as compensation, working conditions, AI, and life in Japan.

      ## Median compensation held steady at 9.5 million yen

      Respondents had [a median compensation of 9.5 million yen](/en-US/current-job/current_total_annual_compensation), unchanged from 2025. 62% of respondents reported that [their compensation had increased](/en-US/current-job/income_evolution) over the past year, up from 57% last year. Only 7% reported that it had decreased.

      Compensation continued to rise with [professional experience](/en-US/demographics/years_of_experience). Respondents with less than one year of experience made a median of 4.5 million yen, while those with more than 20 years of experience made a median of 16.5 million yen.

  - key: overview_2_international_companies.td2026
    t: |
      ## The pay gap between international and Japanese companies stopped shrinking

      Since we first asked about employer type [in our 2020 survey](https://www.tokyodev.com/insights/2020-developer-survey), respondents at international companies have always earned more than those at Japanese companies. The gap between Japanese subsidiaries of international companies and Japanese-headquartered companies [peaked in 2022](https://www.tokyodev.com/insights/2022-developer-survey#employer-type) at 93%, then narrowed every year: [73% in 2023](https://2023.surveys.tokyodev.com/en-US/employer-info/current_employer), [47% in 2024](https://2024.surveys.tokyodev.com/en-US/current-job/current_employer), and [35% in 2025](https://2025.surveys.tokyodev.com/en-US/current-job/current_employer).

      This year, that narrowing came to a halt. [Respondents at Japanese subsidiaries](/en-US/current-job/current_employer) earned a median of 11.5 million yen, 35% more than the 8.5 million yen earned at Japanese-headquartered companies, the same gap as last year. Respondents working for international companies without operations in Japan earned the most, at 12.5 million yen.

  - key: overview_3_work_areas.td2026
    t: |
      ## Machine learning paid more than experience alone would suggest

      Comparing [each work area](/en-US/technology/work_areas) by its respondents' average experience and compensation shows that the two generally went hand in hand. Areas with more experienced respondents paid more, with people management (13.8 million yen on average) and platform engineering (13.4 million yen) at the top.

      Machine learning was the clearest exception. Respondents working in it averaged the least experience of any area, 7.5 years compared to 8.8 years overall, yet made 11.8 million yen, above the 10.7 million yen average. Game development went the other way: its respondents averaged 10.7 years of experience but made only 9.9 million yen.

  - key: overview_4_ai_code_generation.td2026
    t: |
      ## AI went from common to constant

      Last year, 94% of respondents already used AI tools. This year, that rose to 96%, but the bigger change was in how heavily they relied on them. [78% of respondents generated at least half of their code with AI](/en-US/ai-usage/ai_generated_code_balance), up from about a third in 2025.

  - key: overview_5_ai_tools.td2026
    t: |
      Similarly, [68% used AI to generate or refactor code at least a few times a day](/en-US/ai-usage/ai_code_generation_frequency), up from 38% last year, and a third said they used it constantly.

      The tools respondents used changed, too. [Claude overtook ChatGPT](/en-US/ai-usage/ai_tools) as the most popular AI tool, used by 72% of respondents, while ChatGPT fell from 71% last year to 46%. Claude Code, which we asked about for the first time this year, was used by 68%.

  - key: overview_6_ai_job_security.td2026
    t: |
      Employers are a big part of this shift: [85% of respondents said their employer encouraged or required AI use](/en-US/ai-usage/ai_management_pressure), and 20% said it was required.

      Most respondents saw the change as positive. [54% said AI had made their day-to-day experience as a developer better](/en-US/ai-usage/ai_impact), compared to 26% who said it had made it worse, and [only 10% disagreed](/en-US/ai-usage/more_productive) that AI had made them a lot more productive. At the same time, concern is growing: [32% of respondents saw AI as a threat to their job security](/en-US/ai-usage/job_security_threat), up from 19% last year.

  - key: overview_7_immigration.td2026
    t: |
      ## Immigration policy changes left many feeling less welcome

      This year we asked for the first time how changes to Japan's immigration and residency policies over the past year had affected respondents. 538 respondents reported at least one effect. [The most common was feeling less welcome](/en-US/life-in-japan/new_immigration_measures), cited by 67% of them, followed by uncertainty about staying in Japan (60%) and increased anxiety (56%).

  - key: overview_8_life_in_japan.td2026
    t: |
      The same concerns came up elsewhere in the survey. Half of respondents named hostility towards foreigners as one of the [negative aspects of life in Japan](/en-US/life-in-japan/life_japan_negative_aspects), placing it alongside isolation (52%) and cultural barriers (51%), behind only poor compensation (69%). Finances were also under pressure: [64% said the weakening yen had hurt them](/en-US/life-in-japan/yen_value).

      Despite this, most respondents remained committed to living here. [57% said their quality of life had improved](/en-US/life-in-japan/quality_of_life_over_time) since first arriving in Japan, and [44% planned to stay permanently](/en-US/life-in-japan/remaining_in_japan). Only 3% planned to leave soon.

  - key: overview_9_remote_work.td2026
    t: |
      ## Remote work and flexible hours came as a package

      Companies continued to move away from optional remote work. [27% of respondents could choose whether to work remotely](/en-US/current-job/remote_work_policy), down from 32% last year, while hybrid work rose from 43% to 46%.

      Remote work and flexible hours tended to go together. [55% of respondents who could not work remotely had fixed working hours](/en-US/current-job/working_hours_policy), compared to 13% of those in hybrid workplaces and 7% of those who could choose whether to work remotely.

  - key: overview_10_remote_work_job_search.td2026
    t: |
      Respondents without that flexibility were less satisfied. On a scale of 1–5, those who could never work remotely had [an average job happiness score](/en-US/current-job/job_happiness) of 2.9, compared to 3.7 for those who could choose. They were also [the most likely to be looking for a new job](/en-US/current-job/searching_for_job): 44% were job hunting, compared to between 14% and 27% of those whose workplaces allowed remote work.

  - key: overview_11_gender_gap.td2026
    t: |
      ## The gender pay gap appeared at every experience level

      Of our respondents, 87% were men and 10% were women. Overall, [the median compensation of men was 46% higher](/en-US/demographics/gender) than that of women. Part of this reflects experience: men had a median of 8 years of professional experience, compared to 5 years for women.

      However, experience doesn't explain the whole gap. Last year, women with 6 or fewer years of experience had the same median compensation as men. This year, men earned more at every experience level we could compare: 22% more among those with 3 or fewer years of experience, 31% more among those with 4–6 years, and 32% more among those with 10 or more years.

  - key: overview_12_gender_gap_help.td2026
    t: |
      Women face particular challenges in Japan's tech industry. If you'd like to help, see [a four-stage approach for hiring women on your engineering team](https://www.tokyodev.com/articles/hiring-women-on-your-engineering-team).

  - key: overview_13_lgbtq.td2026
    t: |
      ## Women were far more likely to identify as LGBTQ+

      This year, we asked about LGBTQ+ identity for the first time. [7% of respondents identified as LGBTQ+](/en-US/demographics/identify_as_lgbtq), with a large gap by gender: 28% of women did, compared to 4% of men.

  - key: overview_14_lgbtq_marriage.td2026
    t: |
      One barrier LGBTQ+ developers face when considering a move to Japan is that same-sex marriage is not legally recognized. TokyoDev [supports the legalization of same-sex marriage](https://www.tokyodev.com/articles/tokyodev-supports-the-legalization-of-same-sex-marriage-in-japan), and is a member of [Business for Marriage Equality](https://bformarriageequality.net).

  - key: overview_15_fewer_responses.td2026
    t: |
      ## Fewer respondents than last year

      This year's survey received 733 responses, down 26% from 989 last year. The drop came almost entirely from outside TokyoDev's own channels: the number of [respondents who found the survey through TokyoDev](/en-US/metadata/source) fell by only 10%, while those coming from Reddit fell by 59% and those from LinkedIn by 50%.

      Advertising was one factor. Our total spend on Reddit ads was 21% higher than last year ($1,572 compared to $1,300), but the ads brought in far fewer respondents, so the cost per respondent from Reddit tripled, from $8 to $24.

  - key: overview_16_conclusion.td2026
    t: |
      ## Plus so much more

      There are many more insights to be found in [the full survey results](/en-US/demographics/). We also offer the ability to create your own custom charts, allowing you to explore the data any way you like. So please, dive in and take a look. If you find any other interesting connections, you're welcome to share them with [our community](https://discord.gg/seUNe38YgV)!

  - key: conclusion.td2026.paul_mcmahon.bio
    t: Founder, TokyoDev

  - key: conclusion.td2026.paul_mcmahon
    t: |
      TokyoDev's survey wouldn't have been possible without the support of the developers and communities of Japan. Thank you to everyone who helped out!

      Now that you have a better idea of what life is like as a developer in Japan, how about checking out [our guide on getting a developer job here](<https://www.tokyodev.com/articles/first-job-programmer-japan>), or jumping in to [our list of English-friendly developer jobs](https://www.tokyodev.com/jobs).

      You can also join the [7000+ developers on our Discord](https://discord.gg/seUNe38YgV) to discuss developer life in Japan.

      And finally, please sign up for our mailing list below if you're interested in hearing from us the next time we launch a survey!
