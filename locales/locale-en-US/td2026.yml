# used by the TokyoDev 2026 survey

locale: en-US
translations:
  - key: finish.goal_heading.description.td2026
    t: >
      The community of international developers in Japan is small, so every response counts. Last year 989 developers filled it out. This year we’re aiming for 1,000 so we can unlock new insights while still protecting the anonymity of everyone who participates.

  - key: finish.share_message.td2026
    t: >
      The 2026 TokyoDev Survey is now open! Take it here: {link}

