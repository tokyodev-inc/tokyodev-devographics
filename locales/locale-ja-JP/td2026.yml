    t: 代表取締役

  - key: conclusion.td2026.paul_mcmahon
    t: |
      TokyoDevの調査は日本のデベロッパーやコミュニティのサポートなしに実施することができません。ご協力いただいた皆さん、本当にありがとうございました！

      これで日本で開発者として働く生活の実態が少し見えてきたのではないでしょうか。[日本で開発者として働くためのガイド](https://www.tokyodev.com/articles/first-job-programmer-japan)や、[英語で応募できる開発者向け求人](https://www.tokyodev.com/jobs)もぜひご覧ください。

      [TokyoDevのDiscordコミュニティ](https://discord.gg/seUNe38YgV)に参加して、8500人以上の開発者と日本での開発者ライフについて語り合いましょう！

      最後に、今後アンケートを実施する際にお知らせを希望される場合は、ぜひ下記のメールリストにご登録ください！
