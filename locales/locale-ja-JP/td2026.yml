# used by the TokyoDev 2026 survey

locale: ja-JP
translations:
  - key: finish.goal_heading.description.td2026
    t: >
      日本にいる海外出身の開発者コミュニティは小さいため、いただくご回答の一つひとつが大切です。昨年は989名の開発者にご協力いただきました。今年は1,000名の参加を目標とし、皆さまの匿名性を守りつつ新たな知見を得たいと考えています。

  - key: finish.share_message.td2026
    t: >
      2026年版TokyoDevアンケートが公開されました。こちらからご回答いただけます：{link}

  #######################################################
  #                                                     #
  #                         FAQ                         #
  #                                                     #
  #######################################################

  - key: faq.survey_goals_td2026
    t: アンケートの目的は何ですか？
  - key: faq.survey_goals_td2026.description
    t: |
      このアンケートの目的は、日本で働く国際的な開発者の
      労働環境を追跡することです（[前回の版はこちら](https://2026.surveys.tokyodev.com/)）。

  - key: faq.results_released_td2026
    t: 結果はいつ公開されますか？
  - key: faq.results_released_td2026.description
    t: アンケートは2026年9月1日から9月30日まで実施され、その直後に結果が公開されます。

  #######################################################
  #                                                     #
  #                       Notes                         #
  #                                                     #
  #######################################################

  - key: technology.web_frameworks.note.td2026
    t: |
      昨年の調査とは異なり、今年は質問に「上記以外」という選択肢を追加し、スキップせず回答できるようにしました。

      この結果、今年の回答総数が増えたことにより、年ごとの比較では実際のトレンドではなく回答母数が増えた影響が現れている可能性があります。
    aliases:
      - technology.other_frameworks_libraries.note.td2026
      - technology.cloud_platforms.note.td2026
      - technology.communities.note.td2026

  #######################################################
  #                                                     #
  #                      INTROS                         #
  #                                                     #
  #######################################################

  - key: general.td2026.survey_intro
    t: |
      2026年、日本で外国人ソフトウェア開発者として働くことは、自分ではコントロールできない大きな変化の中を進んでいるように感じられるかもしれません。AIはソフトウェア開発のあり方を変えつつあり、日本政府は入管・在留制度を厳格化し、円相場は約40年ぶりの安値圏にあります。

      私たちはこのTokyoDev Developer Surveyを約10年にわたって実施してきましたが、今年の調査はこれまで以上に重要な意味を持つと考えています。

      昨年は[900人を超える開発者の皆さんにご参加いただきました](https://2025.surveys.tokyodev.com/en-US/demographics/)。今年は1,000件以上の回答を目指しています。

      このアンケートは匿名で実施され、個人を特定できるデータが公開されることはありません。集計結果のみを共有します。回答数が多いほど、より信頼性の高い調査結果が得られますので、ぜひ数分お時間をいただいてアンケートにご協力いただき、お知り合いの方にもご紹介いただければ幸いです。

  - key: user_info.user_info_intro_td2026
    t: |
      2026年版TokyoDev Surveyへのご協力ありがとうございます！全質問への回答には10分程度かかります

      注: 現在の状況に当てはまらない質問がある場合は、「スキップ」ボタンをご使用ください。

  #######################################################
  #                                                     #
  #                     User Info                       #
  #                                                     #
  #######################################################

  - key: user_info.japan_province.takeaway.td2026
    t: |
      回答者の78%が首都圏（東京、埼玉、千葉、神奈川）に住んおり、昨年より[2%減少](https://2024.surveys.tokyodev.com/ja-JP/demographics/japan_province)しています。

  - key: user_info.residency_status.takeaway.td2026
    t: |
      回答者の58%が雇用に紐づく在留資格（エンジニアまたは高度専門職）を持っていました。

      高度専門職の在留資格は来日して間もない人に多く、在住1年未満の回答者の22%が保有していたのに対し、1〜3年では11%、それ以上では5%でした。これは、高度専門職には永住権への優遇措置があり、1〜3年で永住許可を申請できることを反映していると考えられます。

  - key: user_info.country.takeaway.td2026
    t: |
      回答者の出身は80の国や地域にわたりました。

  - key: user_info.age.takeaway.td2026
    t: |
      回答者の79%が20〜39歳の間でした。

      年齢が上がるほどフルリモートで働く人の割合は高く、40代では28%と、30代の15%、20代の10%を大きく上回りました。また、リモートワークがまったくできない人の割合は20代がもっとも高く、20%でした。

  - key: user_info.relationship_status.takeaway.td2026
    t: |
      回答者の73%が何らかの形のパートナーシップ関係にあると回答しました。

  - key: user_info.number_of_kids.takeaway.td2026
    t: |
      回答者の71%は子どもがいないと回答しました。ただし、既婚者に限ると47%が子どもありと回答しました。

  - key: user_info.gender.takeaway.td2026
    t: |
      男性回答者は女性回答者より経験が豊富でした。男性の平均経験年数は9年、女性は6.8年でした。

      年収も男性の方が高く、平均1,100万円と、女性の770万円を42%上回りました。ただし、この差のうち経験年数で説明できるのは一部にすぎません。男性の経験年数の構成が女性と同じだったと仮定しても、男性の平均年収は970万円となり、女性を26%上回ります。

      女性が直面する課題の背景は複雑ですが、日本のテック業界における性別格差は明らかです。具体的な改善策は[こちらの記事](https://www.tokyodev.com/articles/hiring-women-on-your-engineering-team)をご覧ください。

  - key: user_info.years_of_experience.takeaway.td2026
    t: |
      回答者のソフトウェア開発経験の中央値は8年でした。

      経験年数が増えるほど年収も上昇し、経験1年未満の年収中央値は280万円、20年以上では1,460万円に達しました。

  - key: user_info.years_in_japan.takeaway.td2026
    t: |
      回答者の日本在住年数の中央値は5年でした。在住年数が長くなるほど日本語能力も高まり、在住3年以下でビジネスレベル以上の日本語力を持つ人は18%でしたが、10年以上では65%に達しました。

      長期在住者は東京に住んでいる割合も低く、在住10年以上で東京在住は46%と、10年未満の63%を下回りました。

      在留資格は、永住許可の原則的な居住要件である在住10年前後を境に大きく変わりました。在住10年以上の回答者の66%が永住者または日本国籍保持者だったのに対し、10年未満では12%にとどまりました。

  - key: user_info.professional_qualifications.takeaway.td2026
    t: |
      回答者の74%がコンピュータサイエンス関連の学士号以上を取得していました。博士号取得者は年収中央値が1,450万円と、全体の950万円を大きく上回りました。これは経験年数によるものではなく、平均経験年数は8.8年と全体と同じでした。ただし、博士号取得者は25人にとどまります。

  - key: user_info.language_proficiency_english.takeaway.td2026
    t: |
      回答者の98%が職場で英語を使うのに問題がないと回答しました。

      英語の流暢さが低い回答者ほどAIを高く評価していました。英語がビジネスレベル以下の回答者の31%が、AIによって日々の仕事が大きく良くなったと答えたのに対し、流暢な回答者では20%、ネイティブでは14%でした。

  - key: user_info.language_proficiency_japanese.takeaway.td2026
    t: |
      回答者の38%が職場で日本語を使うのに問題がないと回答しました。日本語能力は日本での生活の感じ方を大きく左右しており、日本語が基礎レベル以下の回答者の68%が日本生活の悪い点として文化的な壁を挙げたのに対し、ビジネスレベル以上では36%でした。

  - key: user_info.jlpt_level.takeaway.td2026
    t: |
      回答者の54%が、いずれかのレベルのJLPTに合格したと回答しました。

      日本語がビジネスレベルの回答者の69%がJLPT N2以上に合格していました。流暢な回答者では、この割合は87%に上がりました。

      上級の学習者ほど日本のポップカルチャーを好む傾向もありました。N1取得者の60%がポップカルチャーを日本生活の良い点に挙げたのに対し、N2取得者では50%、N3以下またはJLPTなしの回答者では36%でした。

  - key: user_info.identify_as_lgbtq.takeaway.td2026
    t: |
      回答者の7%がLGBTQ+であると自認していました。

      性別による差は大きく、男性では4%だったのに対し、女性では28%でした。

      LGBTQ+のソフトウェア開発者が日本への移住を検討する際の障壁の一つは、同性婚が法的に認められていないことです。TokyoDevは[同性婚の法制化を支持し](https://www.tokyodev.com/articles/tokyodev-supports-the-legalization-of-same-sex-marriage-in-japan)、[Business for Marriage Equality](https://bformarriageequality.net/)に参加しているほか、[LGBTQ+の人々の経験や視点を紹介してきました](https://www.tokyodev.com/blog/categories/lgbtq)。

  - key: user_info.religion.takeaway.td2026
    t: |
      宗教観は国籍によって大きく異なりました。たとえば、インドネシア国籍の回答者の59%が信仰を持ち実践していたのに対し、フランス国籍の回答者の94%は無神論者または不可知論者でした。

      日本のテック業界で働きながら信仰を実践している開発者の経験については、[Being a Muslim Software Engineer in Japan](https://www.tokyodev.com/articles/being-a-muslim-software-engineer-in-japan)をご覧ください。

  - key: user_info.other_japanese_certifications.takeaway.td2026
    t: |
      JLPT以外の日本語資格を持つ回答者は少なく、91%はどの資格も持っていませんでした。もっとも多かったJPTでも、取得者はわずか3%でした。

  #######################################################
  #                                                     #
  #                     Job Info                        #
  #                                                     #
  #######################################################

  - key: job_info.employment_status.takeaway.td2026
    t: |
      もっとも高い年収中央値だったのは役員職で1,600万円、もっとも低いのは派遣・臨時雇用で600万円でした。

      また、役員職の82%が英語ネイティブまたはバイリンガルである一方、派遣・臨時雇用では36%でした。

  - key: job_info.job_title.takeaway.td2026
    t: |
      エンジニアリングマネージャー／マネージャーの年収中央値は1,250万円、シニアエンジニアは1,050万円、ソフトウェアエンジニアは850万円、システムエンジニアは350万円で最も低い結果でした。

  - key: job_info.current_employer.takeaway.td2026
    t: |
      外資系の日本法人に勤める回答者は、日本本社企業に勤める回答者よりも35%高い給与でした。

      この差は年々縮小傾向にあり、2022年の93%→2023年の73%→2024年の47%→2026年の35%へと減少しています。

  - key: job_info.languages_used_colleagues_english.takeaway.td2026
    t: |
      常に英語を使うと回答した人は年収中央値1,050万円ともっとも高く、日本に本社がある企業で働いている人は最も英語を使わないという結果でした。

  - key: job_info.languages_used_colleagues_japanese.takeaway.td2026
    t: |
      同僚と日本語をまったく使わない回答者は、働き方の面で際立っていました。その30%がフルリモートで働いており、他のどのグループと比べても2倍にのぼりました。

      また、残業時間ももっとも少なく、日本語をまったく使わない回答者の45%が残業ゼロだったのに対し、常に日本語を使う回答者では18%でした。日本語の使用頻度が高いほど残業も着実に増え、常に日本語を使う回答者の44%が月10時間以上残業していたのに対し、日本語をまったく使わない回答者では23%でした。

  - key: job_info.work_hours_per_week.takeaway.td2026
    t: |
      週50時間以上働く回答者の32%が転職活動中で、全体の18%と比べて高い割合でした。

  - key: job_info.regular_work_location.takeaway.td2026
    t: |
      リモート可でも45%の回答者が定期的に出社していました。出社する人の転職活動率は12%で、自宅の専用スペースで働く人の17%より低い結果でした。

  - key: job_info.searching_for_job.takeaway.td2026
    t: |
      リモートワークができない回答者の44%が転職活動をしており、リモートワークが認められている職場の回答者の14〜27%を大きく上回りました。この差は経験年数では説明できず、転職活動中の回答者の経験年数の中央値は8年と、他の回答者と同じでした。

  - key: job_info.discrimination_issues.takeaway.td2026
    t: |
      職場で差別を経験した回答者は、仕事への満足度が低い傾向にありました。もっとも多かった出身国による差別を受けた人の仕事満足度は平均2.8（5点満点）で、全体の3.5を下回りました。精神的な状態を理由に差別を受けた人はもっとも低く、2.4でした。

      また、差別を経験した回答者は転職活動をしている割合も高く、44%が積極的に仕事を探していたのに対し、差別を経験していない回答者では18%でした。

  - key: job_info.job_happiness.takeaway.td2026
    t: |
      現在の仕事にネガティブと回答したのは16%のみでした。

      非常に満足している人で転職活動中だったのは1%未満でしたが、不満足な人では61%が転職活動中でした。

  - key: job_info.industry_sector.takeaway.td2026
    t: |
      AIへの取り組みで際立っていたのがEコマース業界です。Eコマース業界の回答者の41%が、会社からAIの使用を義務付けられていると回答し、全体の20%の2倍にのぼりました。

      これらの業界は同僚と日本語のみを使用する割合ももっとも高い傾向にありました。

  - key: job_info.meeting_hours_per_week.takeaway.td2026
    t: |
      会議時間が長いほど経験年数も長い傾向があり、会議ゼロの回答者の経験中央値は3.6年、週15時間以上では13年でした。

  - key: job_info.remote_work_policy.takeaway.td2026
    t: |
      従業員がリモートワークを自由に選べる企業は、引き続き減少しています。昨年は32%の回答者が自分で決められましたが、今年は27%に減りました。その多くはハイブリッド勤務に移ったとみられ、ハイブリッド勤務は43%から46%へと増え、上昇傾向が続いています。

      リモートワークが認められている職場の回答者は、仕事への満足度が高い傾向がありました。5段階評価で、リモートワークを自由に選べる回答者の平均満足度は3.7、完全リモートの回答者は3.6だったのに対し、リモートワークがまったくできない回答者は2.9でした。ハイブリッド勤務の回答者の平均は3.4でした。

  - key: job_info.company_size.takeaway.td2026
    t: |
      回答者の18%が従業員1万人以上の大企業に勤めていましたが、年収2,000万円以上の回答者の44%はこうした大企業で勤務していました。

  - key: job_info.current_total_annual_compensation.takeaway.td2026
    t: |
      回答者の年収中央値は950万円で、昨年の850万円から増加しました。10%の回答者が2,000万円以上と回答しました。

  - key: job_info.income_evolution.takeaway.td2026
    t: |
      前年より収入が減ったと回答したのは、わずか7%でした。収入が増えた割合がもっとも高かったのは正社員で68%と、フリーランスの43%、契約社員の37%を上回りました。

  - key: job_info.working_hours_policy.takeaway.td2026
    t: |
      柔軟な勤務時間はリモートワークと密接に関係していました。リモートワークができない回答者の55%が固定勤務時間制だったのに対し、ハイブリッド制では13%、リモートワークを選べる回答者では7%でした。フルリモートの回答者では、50%がコアタイムなしのフレックスタイム制でした。

  - key: job_info.overtime_hours.takeaway.td2026
    t: |
      回答者の70%は、通常の月の残業時間が10時間未満で、30時間以上残業していたのはわずか7%でした。残業時間が多いほど年収が高いという傾向は見られませんでした。

  - key: job_info.overtime_pay.takeaway.td2026
    t: |
      回答者の60%は、年収に[固定残業代（みなし残業）](https://www.tokyodev.com/articles/overtime-in-japan-laws-pay-rates-and-fixed-overtime)が含まれていました。これは実際の残業時間とはあまり関係がありませんでした。固定残業代の有無にかかわらず、残業時間の中央値はいずれも月1〜9時間で、まったく残業をしていない回答者の半数も固定残業代を受け取っていました。

  #######################################################
  #                                                     #
  #                    Technology                       #
  #                                                     #
  #######################################################

  - key: technology.programming_languages.takeaway.td2026
    t: |
      Pythonがもっとも人気の言語となりました。

      使用言語と年収には相関が見られましたが、主に経験年数の違いによるものでした。Elixir、Kotlin、Swiftの利用者の年収中央値は1,250万円で、経験中央値はそれぞれ18年、10.5年、10年。一方、DartとPHP利用者の年収中央値は550万円で、経験中央値は5年でした。

  - key: technology.web_frameworks.takeaway.td2026
    t: |
      Reactが引き続きもっとも人気のあるWebフレームワークでした。

  - key: technology.cloud_platforms.takeaway.td2026
    t: |
      AWSがもっとも使用されているクラウドプラットフォームでした。

  - key: technology.software_engineering_practices.takeaway.td2026
    t: |
      英語の使用頻度が高いほど、ソフトウェアエンジニアリングのベストプラクティスの導入率が高い傾向が見られました。これは日本に本社がある企業に勤める回答者に限っても同様でした。

      そうした企業では、英語を頻繁に、または常に使う回答者の70%が勤務先で継続的インテグレーションを導入していると答えたのに対し、英語をほとんど、またはまったく使わない回答者では42%でした。同様に、監視・ログは67%対39%、自動テストは68%対42%、IaCは54%対32%でした。英語をあまり使わない回答者のほうが多かったのはウォーターフォール開発のみで、28%対11%でした。

  - key: technology.social_media.takeaway.td2026
    t: |
      日本語ネイティブまたはバイリンガルの回答者ではTwitter/Xの利用が57%ともっとも多く、英語ネイティブでは25%でした。一方、Redditは英語ネイティブの55%、日本語ネイティブの34%が利用していました。

      アンケート回答者の多くはSNS以外から調査を知りましたが、SNS経由ではRedditとLinkedInがもっとも大きな流入元でした。

  - key: technology.work_areas.takeaway.td2026
    t: |
      もっとも多くの回答者が携わっていた業務分野はバックエンド開発で71%、次いでフロントエンド開発が50%でした。経験豊富な回答者が多い分野ほど年収が高い傾向があり、ピープルマネジメント（平均1,380万円）とプラットフォームエンジニアリング（1,340万円）が上位でした。例外は機械学習で、平均経験年数は7.5年と全分野でもっとも短く、全体の8.8年を下回ったにもかかわらず、年収は1,180万円と平均の1,070万円を上回りました。ゲーム開発はその逆で、平均経験年数は10.7年でしたが、年収は990万円にとどまりました。

  - key: technology.other_frameworks_libraries.takeaway.td2026
    t: |
      もっとも広く使われていたライブラリはNumPyとpandasで、それぞれ21%と20%でしたが、42%の回答者は選択肢のいずれも使っていませんでした。年収中央値がもっとも高かったのはApache Kafkaの利用者で、1,150万円でした。

  #######################################################
  #                                                     #
  #                       AI Usage                      #
  #                                                     #
  #######################################################

  - key: ai_usage.ai_tools.takeaway.td2026
    t: |
      回答者の94%が日常的にAIツールを使用していました。Devin利用者の86%が日本に本社のある企業に所属しており、Grok利用者では62%でした。

  - key: ai_usage.ai_uses.takeaway.td2026
    t: |
      最も一般的なAIの利用用途はコード生成でした。

      要約機能の利用率は全体で47%でしたが、エンジニアリングマネージャーやCTOなどリーダー職では71%に達しました。

  - key: ai_usage.ai_generated_code_balance.takeaway.td2026
    t: |
      回答者の33%が、自身のコードの半分以上をAIで生成していました。

  - key: ai_usage.ai_pain_points.takeaway.td2026
    t: |
      性別を問わず、もっとも大きな懸念は「ハルシネーション」と「コードの品質」でした。ただし女性はより広範な社会的影響を懸念しており、倫理36%、プライバシー32%、環境28%と、男性より高い割合で回答していました。

  - key: ai_usage.more_productive.takeaway.td2026
    t: |
      AIツールによって「大幅に生産性が向上した」に同意しないと回答したのは約10人に1人のみで、昨年の約6人に1人から減少しました。

  - key: ai_usage.ai_impact.takeaway.td2026
    t: |
      多くの回答者がAIによって仕事が良くなったと感じていました。54%が開発者としての日々の業務がAIで良くなったと回答した一方、悪くなったと答えたのは約4分の1でした。

      この感じ方は、AIで生産性が上がったと感じているかどうかと強く連動していました。AIツールで大幅に生産性が上がったと強く同意した回答者の86%が日々の業務が良くなったと答えたのに対し、同意しなかった回答者の73%は悪くなったと答えました。

  - key: ai_usage.job_security_threat.takeaway.td2026
    t: |
      回答者の19%のみが、AIが自身の雇用を脅かすと考えていました。

  - key: ai_usage.ai_code_generation_frequency.takeaway.td2026
    t: |
      AIを頻繁に使用する回答者ほど経験年数が短い傾向にあり、AI未使用者の経験中央値は10年、常用者は6年でした。

  - key: ai_usage.ai_management_pressure.takeaway.td2026
    t: |
      回答者の85%が、会社からAIの使用を推奨または義務付けられていると回答し、20%は義務付けられていると答えました。義務化は大きな違いを生んでいました。AIの使用が義務付けられている場合、回答者の86%がコードの4分の3以上をAIで生成していたのに対し、推奨にとどまる場合は59%でした。

  #######################################################
  #                                                     #
  #                   Life in Japan                     #
  #                                                     #
  #######################################################

  - key: life_in_japan.friend_group_balance.takeaway.td2026
    t: |
      日本語能力が高いほど日本人の友人が多い傾向があり、日本語能力ゼロの回答者では91%が「友人はほとんど外国人」と回答した一方、ビジネスレベル以上の回答者では44%でした。

  - key: life_in_japan.hobbies.takeaway.td2026
    t: |
      回答者の主要な趣味はビデオゲーム、プログラミング、映画・テレビ鑑賞と、スクリーンを使うものが上位を占めました。

  - key: life_in_japan.initial_attraction.takeaway.td2026
    t: |
      日本に惹かれた理由は国籍によって異なり、米国籍では日本語への興味、インド籍ではキャリア機会、日本籍では家族が理由として多く挙げられました。

  - key: life_in_japan.life_japan_positive_aspects.takeaway.td2026
    t: |
      日本での生活の良い点としてもっとも多く挙げられたのは、治安、利便性、インフラで、いずれも80%以上の回答者が選びました。目立ったのは米国籍の回答者で、85%が医療、80%が生活費を挙げ、その他の回答者のそれぞれ59%、49%を大きく上回りました。一方、キャリアの機会を挙げたのは9%で、その他の回答者の26%を下回りました。

  - key: life_in_japan.life_japan_negative_aspects.takeaway.td2026
    t: |
      日本での生活の悪い点としてもっとも多く挙げられたのは給与の低さで、69%の回答者が選びました。次いで孤立感、文化的障壁、外国人への敵意が続き、いずれも約半数の回答者が挙げました。

      仕事への満足度は、日本の働き方に対する見方を左右していましたが、それ以外の点にはあまり影響していませんでした。仕事に不満を持つ回答者の60%が職場文化を、60%がキャリアの伸び悩みを挙げたのに対し、仕事にとても満足している回答者ではそれぞれ15%、23%でした。一方、孤立感を挙げた割合は両者でほぼ同じでした。

  - key: life_in_japan.new_immigration_measures.takeaway.td2026
    t: |
      538人の回答者が、過去1年間の日本の入管・在留制度の変更が生活に影響したと回答しました。もっとも多かった影響は「歓迎されていないと感じる」で67%、次いで日本に住み続けられるかの不安が60%、不安やストレスの増加が56%でした。

      永住者は実務的な影響はほとんど受けていませんでしたが、雰囲気の変化からは逃れられませんでした。影響を受けた永住者のうち、在留資格に関する懸念を挙げたのは11%で、技術・人文知識・国際業務の在留資格を持つ人の50%を大きく下回りました。一方で、81%が歓迎されていないと感じており、どのグループよりも高い割合でした。

  - key: life_in_japan.communities.takeaway.td2026
    t: |
      回答者の56%が何らかの開発者コミュニティに参加しており、前年の49%から増加しました。

      もっともコミュニティとつながっていたのは女性とコーディングブートキャンプ修了者でした。女性の66%が何らかの開発者コミュニティに参加しており、男性の55%を上回りました。また、女性の32%がWomen in Software Engineering Japanに参加していました。ブートキャンプ修了者では83%がコミュニティに参加しており、その他の回答者の52%を大きく上回りました。

  - key: life_in_japan.quality_of_life_over_time.takeaway.td2026
    t: |
      回答者の57%が来日以来生活の質が向上したと回答し、32%は大きく向上したと答えました。悪化したと回答したのは17%でした。

  - key: life_in_japan.remaining_in_japan.takeaway.td2026
    t: |
      回答者の44%が日本に永住する予定で、29%はまだ決めていませんでした。日本語能力が高いほど定住する傾向があり、ビジネスレベル以上の日本語力を持つ回答者の52%が永住を予定していたのに対し、日本語が基礎レベル以下の回答者では35%でした。

  - key: life_in_japan.yen_value.takeaway.td2026
    t: |
      回答者の64%が円安によって家計に悪影響があったと回答し、18%は大きな影響があったと答えました。良い影響があったと回答したのはわずか8%でした。

  #######################################################
  #                                                     #
  #            RESULTS INTRO OVERVIEW                   #
  #                                                     #
  #######################################################

  - key: overview_1_median_compensation.td2026
    t: |
      # 2026年TokyoDev開発者アンケート結果

      毎年、TokyoDevは日本で働く海外出身ソフトウェア開発者の実態を把握するためにアンケートを実施しています。今年は733名が参加し、給与、労働環境、AI、日本での生活など50近くの項目に回答しました。

      ## 年収中央値は950万円で横ばい

      [年収中央値は950万円](/ja-JP/current-job/current_total_annual_compensation)で、2025年から変わりませんでした。過去1年間で[年収が増えた](/ja-JP/current-job/income_evolution)と回答したのは62%で、昨年の57%から増加しました。減少したと回答したのはわずか7%でした。

      年収は引き続き[経験年数](/ja-JP/demographics/years_of_experience)とともに上昇し、経験1年未満の回答者の年収中央値は450万円、20年超では1,650万円でした。

  - key: overview_2_international_companies.td2026
    t: |
      ## 外資系企業と日本企業の給与格差、縮小が止まる

      [2020年の調査](https://www.tokyodev.com/insights/2020-developer-survey)で初めて勤務先の種類について尋ねて以来、外資系企業で働く回答者の年収は常に日本企業を上回ってきました。外資系企業の日本法人と日本本社企業の格差は[2022年に93%](https://www.tokyodev.com/insights/2022-developer-survey#employer-type)でピークに達し、その後は毎年縮小してきました。[2023年は73%](https://2023.surveys.tokyodev.com/ja-JP/employer-info/current_employer)、[2024年は47%](https://2024.surveys.tokyodev.com/ja-JP/current-job/current_employer)、[2025年は35%](https://2025.surveys.tokyodev.com/ja-JP/current-job/current_employer)です。

      今年はその縮小が止まりました。[外資系企業の日本法人で働く回答者](/ja-JP/current-job/current_employer)の年収中央値は1,150万円で、日本本社企業の850万円を35%上回り、昨年と同じ差でした。もっとも年収が高かったのは日本に拠点を持たない外資系企業で働く回答者で、1,250万円でした。

  - key: overview_3_work_areas.td2026
    t: |
      ## 機械学習の職種は経験年数の割に高収入

      [業務分野ごと](/ja-JP/technology/work_areas)に回答者の平均経験年数と平均年収を比べると、両者はおおむね連動していました。経験豊富な回答者が多い分野ほど年収が高く、ピープルマネジメント（平均1,380万円）とプラットフォームエンジニアリング（1,340万円）が上位でした。

      もっとも顕著な例外は機械学習でした。機械学習に携わる回答者の平均経験年数は7.5年と全分野でもっとも短く、全体の8.8年を下回りましたが、年収は1,180万円と平均の1,070万円を上回りました。ゲーム開発はその逆で、平均経験年数は10.7年でしたが、年収は990万円にとどまりました。

  - key: overview_4_ai_code_generation.td2026
    t: |
      ## AIコーディングツールが日常の開発に定着

      昨年の時点で、回答者の94%がすでにAIツールを使っていました。今年はその割合が96%に上がりましたが、より大きな変化は依存度の高まりです。[回答者の78%がコードの半分以上をAIで生成しており](/ja-JP/ai-usage/ai_generated_code_balance)、2025年の約3分の1から大きく増えました。

  - key: overview_5_ai_tools.td2026
    t: |
      同様に、[68%が1日に数回以上AIでコードの生成やリファクタリングを行っており](/ja-JP/ai-usage/ai_code_generation_frequency)、昨年の38%から増加しました。3分の1は常に使っていると回答しました。

      使われるツールも変わりました。[ClaudeがChatGPTを抜いて](/ja-JP/ai-usage/ai_tools)もっとも人気のAIツールとなり、回答者の72%が使用していました。一方、ChatGPTは昨年の71%から46%に減少しました。今年初めて調査したClaude Codeは68%が使用していました。

  - key: overview_6_ai_job_security.td2026
    t: |
      この変化には雇用主が大きく関わっています。[回答者の85%が、会社からAIの使用を推奨または義務付けられている](/ja-JP/ai-usage/ai_management_pressure)と回答し、20%は義務付けられていると答えました。

      多くの回答者はこの変化を前向きに捉えていました。[54%がAIによって開発者としての日々の業務が良くなった](/ja-JP/ai-usage/ai_impact)と回答し、悪くなったと答えたのは26%でした。また、AIによって生産性が大きく向上したという意見に[反対したのはわずか10%](/ja-JP/ai-usage/more_productive)でした。一方で懸念も高まっており、[回答者の32%がAIを雇用の安定に対する脅威と考えており](/ja-JP/ai-usage/job_security_threat)、昨年の19%から増加しました。

  - key: overview_7_immigration.td2026
    t: |
      ## 入管政策の変更で、多くの開発者が「歓迎されていない」と感じるように

      今年初めて、過去1年間の日本の入管・在留制度の変更が回答者にどのような影響を与えたかを尋ねました。538人が何らかの影響があったと回答しました。[もっとも多かったのは「歓迎されていないと感じる」](/ja-JP/life-in-japan/new_immigration_measures)で67%、次いで日本に住み続けられるかの不安（60%）、不安やストレスの増加（56%）でした。

  - key: overview_8_life_in_japan.td2026
    t: |
      同様の懸念はアンケートの他の項目にも表れていました。回答者の半数が[日本での生活の悪い点](/ja-JP/life-in-japan/life_japan_negative_aspects)として外国人への敵意を挙げ、孤立感（52%）や文化的障壁（51%）と並び、給与の低さ（69%）に次ぐ多さでした。家計も圧迫されており、[64%が円安で悪影響を受けた](/ja-JP/life-in-japan/yen_value)と回答しました。

      それでも、多くの回答者は日本で暮らし続けるつもりでした。[57%が来日以来生活の質が向上した](/ja-JP/life-in-japan/quality_of_life_over_time)と回答し、[44%が永住を予定していました](/ja-JP/life-in-japan/remaining_in_japan)。近いうちに日本を離れる予定の人はわずか3%でした。

  - key: overview_9_remote_work.td2026
    t: |
      ## リモートワークと柔軟な勤務時間は連動する傾向

      企業は引き続き、リモートワークを社員が選べる働き方から離れつつあります。[リモートワークするかどうかを選べる回答者](/ja-JP/current-job/remote_work_policy)は27%で、昨年の32%から減少した一方、ハイブリッド制は43%から46%に増えました。

      リモートワークと柔軟な勤務時間は連動する傾向がありました。[リモートワークができない回答者の55%が固定勤務時間制](/ja-JP/current-job/working_hours_policy)だったのに対し、ハイブリッド制の職場では13%、リモートワークを選べる回答者では7%でした。

  - key: overview_10_remote_work_job_search.td2026
    t: |
      こうした柔軟性のない回答者は満足度が低い傾向にありました。1〜5の尺度で、リモートワークがまったくできない回答者の[仕事の満足度の平均](/ja-JP/current-job/job_happiness)は2.9で、リモートワークを選べる回答者の3.7を下回りました。また、[転職活動をしている割合ももっとも高く](/ja-JP/current-job/searching_for_job)、44%が求職中だったのに対し、リモートワークが認められている職場の回答者では14%〜27%でした。

  - key: overview_11_gender_gap.td2026
    t: |
      ## 男女の給与格差はすべての経験年数で続いた

      回答者の87%が男性、10%が女性でした。全体で[男性の年収中央値は女性より46%高く](/ja-JP/demographics/gender)なっていました。その一因は経験年数で、職務経験の中央値は男性が8年、女性が5年でした。

      しかし、経験年数だけでは格差の全体を説明できません。昨年は、経験6年以下の女性の年収中央値は男性と同じでした。今年は、比較できたすべての経験年数で男性の年収が上回りました。男性の方が、経験3年以下では22%、4〜6年では31%、10年以上では32%高くなっていました。

  - key: overview_12_gender_gap_help.td2026
    t: |
      日本のテック業界で、女性は特有の課題に直面しています。改善に取り組みたい方は、[女性エンジニアをチームに採用するための4ステップ](https://www.tokyodev.com/ja/articles/4-steps-for-hiring-women-on-your-engineering-team)をご覧ください。

  - key: overview_13_lgbtq.td2026
    t: |
      ## 女性は男性よりLGBTQ+を自認する割合が大幅に高い

      今年初めて、LGBTQ+の自認について尋ねました。[回答者の7%がLGBTQ+であると自認しており](/ja-JP/demographics/identify_as_lgbtq)、性別による差が大きく、女性では28%、男性では4%でした。

  - key: overview_14_lgbtq_marriage.td2026
    t: |
      LGBTQ+の開発者が日本への移住を検討する際の障壁の一つは、同性婚が法的に認められていないことです。TokyoDevは[同性婚の法制化を支持し](https://www.tokyodev.com/articles/tokyodev-supports-the-legalization-of-same-sex-marriage-in-japan)、[Business for Marriage Equality](https://bformarriageequality.net/)に参加しているほか、[LGBTQ+の人々の経験や視点を紹介してきました](https://www.tokyodev.com/blog/categories/lgbtq)。

  - key: overview_15_fewer_responses.td2026
    t: |
      ## 回答者数は昨年より減少

      今年のアンケートの回答数は733件で、昨年の989件から26%減少しました。減少はほぼすべてTokyoDev以外の経路によるものでした。[TokyoDev経由でアンケートを知った回答者](/ja-JP/metadata/source)の減少は10%にとどまった一方、Reddit経由は59%、LinkedIn経由は50%減少しました。

      要因の一つは広告です。Reddit広告への総支出は昨年より21%多い1,572ドル（昨年は1,300ドル）でしたが、集まった回答者ははるかに少なく、Reddit経由の回答者1人あたりのコストは8ドルから24ドルへと3倍になりました。

      来年のアンケートをより多くの人に届けるため、ぜひご協力ください。アンケートを共有できるコミュニティなどをご存じでしたら、[hello@tokyodev.com](mailto:hello@tokyodev.com)までお知らせください。

  - key: overview_16_conclusion.td2026
    t: |
      ## 他にも多くの知見

      [全調査結果](/ja-JP/demographics/)にはさらに多くの知見があります。独自のチャートを作成する機能もあるので、ぜひ自由にデータを探索してみてください。面白い発見があれば、[コミュニティ](https://discord.gg/seUNe38YgV)でぜひ共有してください！

