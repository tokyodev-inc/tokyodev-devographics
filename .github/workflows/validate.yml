name: Validate

on:
    pull_request:
    push:
        branches: [main]

jobs:
    yaml:
        name: YAML files parse
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm
            - run: npm ci
            - run: npm run validate:yaml
